[project]
name = "ccr"
version = "0.1.0"
description = "Counterparty Credit Risk & XVA Monte Carlo engine — server and tooling"
requires-python = ">=3.9"
dependencies = [
    # ── Web framework ─────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",

    # ── Database ─────────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # ── Auth ─────────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",

    # ── Market data ───────────────────────────────────────────────────────────
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "requests>=2.31",

    # ── Scheduler ────────────────────────────────────────────────────────────
    "apscheduler>=3.10",

    # ── Reports ──────────────────────────────────────────────────────────────
    "reportlab>=4.0",

    # ── Email alerts ─────────────────────────────────────────────────────────
    "aiosmtplib>=3.0",
]

[tool.uv]
# The repo root is not an installable Python package — uv should only sync deps.
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
